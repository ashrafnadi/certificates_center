{% load static %}
<!-- Filters + Table Combined for HTMX -->
<div id="auditor-content-wrapper">
    <!-- Filters -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h6 class="mb-0"><i class="bi bi-funnel me-2"></i>تصفية الخريجين غير المدققين</h6>
        </div>
        <div class="card-body">
            <form id="auditor-filter-form"
                  hx-get="{% url 'graduates:auditor_list' %}"
                  hx-target="#auditor-content-wrapper"
                  hx-trigger="change"
                  hx-push-url="true"
                  hx-indicator="#filter-spinner">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small text-muted">القسم</label>
                        <select name="section_id"
                                class="form-select"
                                hx-get="{% url 'graduates:auditor_list' %}"
                                hx-target="#auditor-content-wrapper"
                                hx-trigger="change"
                                hx-push-url="true">
                            <option value="">-- جميع الأقسام --</option>
                            {% for sec in sections %}
                                <option value="{{ sec.section_id }}"
                                        {% if selected_section_id == sec.section_id|stringformat:"s" %}selected{% endif %}>
                                    {{ sec.section_ar_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">التخصص</label>
                        <select name="specialization_id" class="form-select">
                            <option value="">-- جميع التخصصات --</option>
                            {% for spec in specializations %}
                                <option value="{{ spec.specialization_id }}"
                                        {% if selected_specialization_id == spec.specialization_id|stringformat:"s" %}selected{% endif %}>
                                    {{ spec.specialization_ar_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">الدور / السنة</label>
                        <select name="turn_id" class="form-select">
                            <option value="">-- جميع السنوات --</option>
                            {% for turn in turns %}
                                <option value="{{ turn.faculty_turn_id }}"
                                        {% if selected_turn_id == turn.faculty_turn_id|stringformat:"s" %}selected{% endif %}>
                                    {{ turn.turn_ar_name }} - {{ turn.turn_year }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="hidden" name="unchecked" value="0" />
                        <div class="form-check form-switch">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="unchecked"
                                   value="1"
                                   id="uncheckedToggle"
                                   {% if show_unchecked_only %}checked{% endif %} />
                            <label class="form-check-label small" for="uncheckedToggle">غير مدقق فقط</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text"
                                   name="q"
                                   class="form-control"
                                   placeholder="بحث بالاسم أو رقم البطاقة..."
                                   value="{{ search_query }}"
                                   hx-get="{% url 'graduates:auditor_list' %}"
                                   hx-target="#auditor-content-wrapper"
                                   hx-trigger="keyup changed delay:500ms"
                                   hx-push-url="true" />
                        </div>
                    </div>
                    <div class="col-md-2">
                        <a href="{% url 'graduates:auditor_list' %}"
                           class="btn btn-outline-secondary w-100">
                            <i class="bi bi-arrow-counterclockwise me-1"></i> إعادة تعيين
                        </a>
                    </div>
                </div>
            </form>
            <div id="filter-spinner" class="htmx-indicator text-center mt-2">
                <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
                <span class="small text-muted">جاري التحميل...</span>
            </div>
        </div>
    </div>
    <!-- Table -->
    {% include "graduates/auditor/partials/graduates_table.html" %}
</div>
