{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="description" content="My Site Description" />
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <title>{% block title %}{{ APPLICATION_NAME }}{% endblock %}</title>
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" />
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
        <link rel="stylesheet"
              href="{% static 'css/dataTables.bootstrap5.min.css' %}" />
        <link rel="stylesheet"
              href="{% static 'css/dataTables.inputPaging.min.css' %}" />
        <link rel="stylesheet" href="{% static 'css/custom.css' %}" />
        {% block extra_css %}{% endblock %}
    </head>
    <body class="bg-body-tertiary">
        <!-- ===== Top Bar ===== -->
        {% include 'partials/topbar.html' %}
        <!-- ===== Sidebar Overlay (Mobile) ===== -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <!-- ===== Side Menu ===== -->
        {% include 'partials/sidemenu.html' %}
        <!-- ===== Main Content ===== -->
        <main class="main-content" id="mainContent">
            <div class="container-fluid py-3 py-lg-4">
                {% block content %}{% endblock %}
            </div>
        </main>
        <!-- Bootstrap Bundle with Popper -->
        <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
        <!-- HTMX -->
        <script src="{% static 'js/htmx.min.js' %}"></script>
        <!-- jQuery and DataTables -->
        <script src="{% static 'js/jquery.min.js' %}"></script>
        <script src="{% static 'js/dataTables.min.js' %}"></script>
        <script src="{% static 'js/dataTables.bootstrap5.min.js' %}"></script>
        <script src="{% static 'js/dataTables.inputPaging.min.js' %}"></script>
        <!-- Select2 JS -->
        <script src="{% static 'js/select2.min.js' %}"></script>
        <!-- Custom JS -->
        <script src="{% static 'js/custom.js' %}"></script>
        {% block extra_js %}{% endblock %}
    </body>
</html>
