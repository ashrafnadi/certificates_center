<aside class="sidebar" id="sidebar">

                id="sidebarClose"
                aria-label="إغلاق">

        </button>
    </div>
    <nav class="sidebar-nav">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link
                          {% if request.resolver_match.url_name == 'index' %}active{% endif %}"
                   href="{% url 'graduates:index' %}">
                    <i class="bi bi-house-door"></i>
                    <span>الرئيسية</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'graduates:graduate_list' %}">
                    <i class="bi bi-people"></i>
                    <span>الخريجين</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>الشهادات</span>
                </a>
            </li>
            <li class="nav-section">الإعدادات الأكاديمية</li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-building"></i>
                    <span>الكليات</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-book"></i>
                    <span>التخصصات</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-award"></i>
                    <span>الدرجات العلمية</span>
                </a>
            </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin:index' %}">

            <li class="nav-item">
                <a class="nav-link" href="#">
